<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Environment Variables</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --ink: #1c1916;
      --muted: #5c564e;
      --card: #fffcf7;
      --line: #d9d1c3;
      --accent: #0f6b4c;
      --accent-ink: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      color: var(--muted);
    }

    h1, h2 {
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2.25rem;
    }

    h2 {
      margin: 2rem 0 0.75rem;
      font-size: 1.15rem;
    }

    .lede, .empty, .status {
      font-family: system-ui, sans-serif;
    }

    .lede {
      margin: 0 0 1.75rem;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 0.9rem;
      padding: 1.25rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
    }

    input {
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }

    button {
      justify-self: start;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .status {
      min-height: 1.4rem;
      margin: 0.9rem 0 0;
      color: var(--accent);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.6rem;
    }

    li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1rem;
      padding: 0.9rem 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92rem;
    }

    .empty { color: var(--muted); }

    .empty[hidden],
    ul:empty + .empty { display: none; }

    code { font: inherit; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Local demo</p>
      <h1>Create an environment variable</h1>
      <p class="lede">
        Add a name and value, then save it. Variables stay in this browser
        until you clear them.
      </p>
    </header>

    <form id="variable-form" autocomplete="off">
      <label>
        Name
        <input
          id="var-name"
          name="name"
          type="text"
          required
          placeholder="API_URL"
          pattern="[A-Za-z_][A-Za-z0-9_]*"
          title="Use letters, numbers, and underscores. Must start with a letter or underscore."
        />
      </label>
      <label>
        Value
        <input
          id="var-value"
          name="value"
          type="text"
          required
          placeholder="https://example.com"
        />
      </label>
      <button type="submit">Save variable</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Saved variables</h2>
      <ul id="variable-list"></ul>
      <p id="empty-state" class="empty">No variables yet. Save one above.</p>
    </section>
  </main>
  <script>
    const STORAGE_KEY = "env-variables";
    const form = document.getElementById("variable-form");
    const nameInput = document.getElementById("var-name");
    const valueInput = document.getElementById("var-value");
    const list = document.getElementById("variable-list");
    const emptyState = document.getElementById("empty-state");
    const status = document.getElementById("status");

    function loadVariables() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveVariables(variables) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(variables));
    }

    function render() {
      const variables = loadVariables();
      list.innerHTML = "";

      for (const item of variables) {
        const li = document.createElement("li");
        const label = document.createElement("code");
        label.textContent = item.name + "=" + item.value;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", function () {
          const next = loadVariables().filter(function (entry) {
            return entry.name !== item.name;
          });
          saveVariables(next);
          status.textContent = "Removed " + item.name + ".";
          render();
        });

        li.append(label, remove);
        list.append(li);
      }

      emptyState.hidden = variables.length > 0;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const name = nameInput.value.trim();
      const value = valueInput.value.trim();
      if (!name || !value) return;

      const next = loadVariables().filter(function (entry) {
        return entry.name !== name;
      });
      next.push({ name: name, value: value });
      saveVariables(next);

      status.textContent = "Saved " + name + ".";
      form.reset();
      nameInput.focus();
      render();
    });

    render();
  </script>
</body>
</html>
