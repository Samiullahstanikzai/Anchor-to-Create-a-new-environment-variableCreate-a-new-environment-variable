<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEO Auditor</title>
    <!-- App Bridge must load before any other script, straight from Shopify's CDN. -->
    <meta name="shopify-api-key" content="__SHOPIFY_API_KEY__" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>SEO Auditor</h1>
        <nav class="tabs" id="tabs">
          <button data-view="dashboard" class="tab active">Dashboard</button>
          <button data-view="product" class="tab">Products</button>
          <button data-view="collection" class="tab">Collections</button>
          <button data-view="page" class="tab">Pages</button>
          <button data-view="article" class="tab">Blog posts</button>
          <button data-view="sitemap" class="tab">Sitemap &amp; robots.txt</button>
        </nav>
      </header>
      <main id="content" class="content">
        <p class="loading">Loading…</p>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
