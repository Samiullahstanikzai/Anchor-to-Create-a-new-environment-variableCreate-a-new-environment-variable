name: SEO Auditor App Tests

on:
  push:
    branches:
      - main
    paths:
      - "shopify-seo-app/**"
      - ".github/workflows/shopify-seo-app-tests.yml"
  pull_request:
    paths:
      - "shopify-seo-app/**"
      - ".github/workflows/shopify-seo-app-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-seo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
